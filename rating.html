<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ESG Rating</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="app.js"></script></head><body><script>
const c=layout('ESG Rating','ТОП компаний по городам, отраслям и рейтингу.');c.innerHTML=`<div class="grid cols-3"><label>Город<select><option>Все</option><option>Алматы</option><option>Астана</option></select></label><label>Отрасль<select><option>Все</option><option>IT</option><option>Производство</option></select></label><label>Рейтинг<select><option>Все</option><option>A</option><option>B</option></select></label></div><div class="card" style="margin-top:18px"><table><thead><tr><th>Место</th><th>Компания</th><th>ESG Score</th><th>Environment</th><th>Social</th><th>Governance</th><th>CO₂</th><th>Вода</th><th>Энергия</th><th>Деревья</th><th>Последний аудит</th></tr></thead><tbody>${companies.sort((a,b)=>b[3]-a[3]).map((x,i)=>`<tr><td>${i+1}</td><td>${x[0]}</td><td>${x[3]}</td><td>${x[3]-2}</td><td>${x[3]+1}</td><td>${x[3]-1}</td><td>${900+i*80}</td><td>${400+i*20}</td><td>${1200-i*70}</td><td>${800+i*200}</td><td>2026-06-${10+i}</td></tr>`).join('')}</tbody></table></div>`;
</script></body></html>
