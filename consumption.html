<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Потребление</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="app.js"></script></head><body><script>
const c=layout('Потребление','Энергия, вода, газ, топливо, отходы и CO₂.');c.innerHTML='<div class="grid cols-2">'+['Энергия','Вода','Газ','Топливо','Отходы','CO₂'].map((x,i)=>`<div class=card><h3>${x}</h3><canvas id="c${i}"></canvas></div>`).join('')+'</div>';['Энергия','Вода','Газ','Топливо','Отходы','CO₂'].forEach((x,i)=>chart('c'+i,'line',['Пн','Вт','Ср','Чт','Пт'],[20+i*3,24+i,18+i*2,30+i,26+i*2],x));
</script></body></html>
