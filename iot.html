<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IoT Dashboard</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="app.js"></script></head><body><script>
const c=layout('IoT Dashboard','Онлайн датчики, графики и история показаний обновляются автоматически.');c.innerHTML=statCards([['Онлайн датчики','15/15','ok','online'],['Статус подключения','Stable','ok','MQTT'],['Последнее обновление',new Date().toLocaleTimeString(),'','auto'],['Объекты на карте','6','','GIS']])+`<div class="grid cols-2" style="margin-top:18px"><div class="card"><h3>Карта объектов</h3><div id="map" class="map mini-map"></div></div><div class="card"><h3>Графики</h3><canvas id="iotChart"></canvas></div></div><div class="card" style="margin-top:18px"><h3>История показаний</h3><table><thead><tr><th>Датчик</th><th>Значение</th><th>Статус</th><th>Обновлено</th></tr></thead><tbody id="rows"></tbody></table></div>`;initEnterpriseMap('map');function upd(){document.querySelector('.metric:nth-child(3) b').textContent=new Date().toLocaleTimeString();rows.innerHTML=sensors.map(s=>`<tr><td>${s}</td><td>${(Math.random()*100).toFixed(1)}</td><td class="ok">норма</td><td>${new Date().toLocaleTimeString()}</td></tr>`).join('')}upd();setInterval(upd,3000);chart('iotChart','line',['00','04','08','12','16','20'],[31,42,38,57,49,63],'IoT');
</script></body></html>
