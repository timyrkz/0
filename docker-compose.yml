services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: sdg, POSTGRES_PASSWORD: sdg, POSTGRES_DB: sdg_platform }
    ports: ['5432:5432']
  redis:
    image: redis:7
    ports: ['6379:6379']
  meilisearch:
    image: getmeili/meilisearch:v1.10
    environment: { MEILI_NO_ANALYTICS: 'true' }
    ports: ['7700:7700']
  minio:
    image: minio/minio
    command: server /data --console-address ':9001'
    environment: { MINIO_ROOT_USER: sdgadmin, MINIO_ROOT_PASSWORD: sdgpassword }
    ports: ['9000:9000', '9001:9001']
