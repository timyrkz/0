<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Экопартнеры</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="app.js"></script></head><body><script>
const c=layout('Экопартнеры','Переработчики, сборщики, полигоны, лицензии и контакты.');c.innerHTML='<div class="grid cols-3">'+['RecyclePro','EcoCollect','SafeLandfill'].map((x,i)=>`<div class=card><h3>${x}</h3><p>${['Переработчик','Сборщик','Полигон'][i]}</p><p>Лицензия № ECO-${100+i}</p><p>Рейтинг ${90-i*4}</p><button class="btn primary">Передать отходы</button></div>`).join('')+'</div>';
</script></body></html>
