<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Recommendations</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="app.js"></script></head><body><script>
const c=layout('AI Recommendations','ИИ анализирует все показатели и предлагает действия.');const rec=['Поменять освещение','Установить солнечные панели','Оптимизировать насосы','Заменить оборудование','Снизить расход воды','Увеличить переработку','Посадить деревья','Подключить новые датчики'];c.innerHTML='<div class="grid cols-2">'+rec.map((x,i)=>`<div class=card><h3>${x}</h3><p>Экономия: ${5+i*3}% · Рост ESG: +${1+i%4} · Окупаемость: ${8+i} мес. · Снижение CO₂: ${20+i*6} т</p><button class="btn primary">Внедрить</button></div>`).join('')+'</div>';
</script></body></html>
